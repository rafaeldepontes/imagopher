  golang-project:
    container_name: "my-project"
    build:
      context: ./
      dockerfile: Dockerfile
    image: golang-project
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: 1
    env_file:
      - .env.example
    ports:
      - "8080:8080"

volumes:
  postgres:
